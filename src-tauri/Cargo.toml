[package]
name = "imapsync-studio"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
native-tls = "0.2"
shell-words = "1"
tempfile = "3"
base64 = "0.22.1"
getrandom = "0.4"
sha2 = "0.10.9"
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

tauri-plugin-dialog = "=2.7.2"
ring = "0.17.14"

[dev-dependencies]
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
