name: Verify desktop builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev librsvg2-dev libayatana-appindicator3-dev patchelf perl libperl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install JavaScript dependencies
        run: npm ci
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os != 'macOS'
        with:
          perl-version: '5.40'
          distribution: strawberry
      - name: Build private Perl on macOS
        if: runner.os == 'macOS'
        run: npm run engine:perl
      - name: Build private OpenSSL on macOS
        if: runner.os == 'macOS'
        run: npm run engine:openssl
      - name: Install engine build dependencies
        run: npm run engine:deps
      - name: Prepare bundled imapsync
        run: npm run engine:prepare
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Lint Rust backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Package unsigned application
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Imapsync Studio.app' 'src-tauri/target/release/bundle/Imapsync-Studio-macos.zip'
      - uses: actions/upload-artifact@v6
        with:
          name: imapsync-studio-${{ runner.os }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe

  imap-integration:
    name: Real IMAP migration (disposable servers)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/imap/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os != 'macOS'
        with:
          perl-version: '5.40'
          distribution: strawberry
      - name: Build private Perl on macOS
        if: runner.os == 'macOS'
        run: npm run engine:perl
      - name: Build private OpenSSL on macOS
        if: runner.os == 'macOS'
        run: npm run engine:openssl
      - run: npm run engine:deps
      - run: npm run engine:prepare
      - run: npm run build
      - name: Install test-only IMAP server
        run: python -m pip install -r tests/imap/requirements.txt
      - name: Verify integration harness failure reporting
        run: python -m unittest discover -s tests/imap -p 'test_*.py'
      - name: Verify real transfer, resume, batch and deletion behavior
        run: python tests/imap/run.py --output test-results/imap-integration.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: imap-integration-summary
          path: test-results/*.json
          if-no-files-found: warn
          retention-days: 14
